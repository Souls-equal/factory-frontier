name: CI

# Pull-request validation only.
#
# Pushes to `main` are validated by the Pages deployment workflow, which runs the
# same production gate before uploading `dist/`. Triggering CI on every branch
# push as well produced two identical runs for each PR update (one for `push`,
# one for `pull_request`); this workflow now runs exactly once per PR head commit.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR supersedes the older validation run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test and verify build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc --noEmit` itself; the separate step keeps a
      # type error visible on its own line instead of inside the bundle step.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output (GitHub Pages base path)
        run: npm run verify:build

      - name: Verify preview server serves the build
        run: npm run verify:preview

      - name: Verify development server
        run: npm run verify:dev
